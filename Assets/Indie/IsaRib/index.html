function _dec(b,k){
  var raw=atob(b),bytes=new Uint8Array(raw.length);
  for(var i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);
  var kk=[];for(var i=0;i<k.length;i++)kk.push(k.charCodeAt(i));
  var out=new Uint8Array(bytes.length);
  for(var i=0;i<bytes.length;i++)out[i]=bytes[i]^kk[i%kk.length];
  return new TextDecoder().decode(out);
}

var _swScope = location.href.slice(0, location.href.lastIndexOf('/')+1);

function _ensureSelfIsolated(){
  return new Promise(function(resolve){
    if (window.crossOriginIsolated) { resolve(); return; }
    if (!('serviceWorker' in navigator) || !window.isSecureContext) { resolve(); return; }
    navigator.serviceWorker.register('./sw.js', {scope:_swScope}).then(function(){
      return navigator.serviceWorker.ready;
    }).then(function(){
      if (sessionStorage.getItem('__coiReloaded')) { resolve(); return; }
      sessionStorage.setItem('__coiReloaded','1');
      location.reload();
    }).catch(function(e){ console.error('[gate] SW register failed', e); resolve(); });
  });
}

function _launch(html){
  var base=location.href.slice(0, location.href.lastIndexOf('/')+1);
  var out=/<head[^>]*>/i.test(html)
    ? html.replace(/<head([^>]*)>/i, '<head$1><base href="'+base+'">')
    : html.replace(/<html[^>]*>/i, '$&<head><base href="'+base+'"></head>');
  var launchUrl=base+'__launch__/'+Date.now();
  caches.open('coi-launch').then(function(cache){
    return cache.put(launchUrl, new Response(out, {
      headers:{
        'Content-Type':'text/html; charset=utf-8',
        'Cross-Origin-Opener-Policy':'same-origin',
        'Cross-Origin-Embedder-Policy':'require-corp'
      }
    }));
  }).then(function(){
    var f=document.createElement('iframe');
    f.style.cssText='position:fixed;inset:0;width:100%;height:100%;border:0;background:#08080a';
    f.setAttribute('allow','fullscreen; autoplay; gamepad; clipboard-write; encrypted-media; picture-in-picture; cross-origin-isolated');
    f.setAttribute('allowfullscreen','');
    document.body.innerHTML='';
    document.body.style.margin='0';
    document.body.appendChild(f);
    f.src=launchUrl;
  });
}

_ensureSelfIsolated().then(function(){
  document.getElementById('prep').style.display='none';
  var fa=document.getElementById('fa');
  fa.style.display='flex';
  _inp=document.getElementById('k');

    sessionStorage.removeItem('__c7k');
  }

    var key=_inp.value.trim();
    if(!key)return;
    try{
      var r=_dec(_B,key);
      if(r.slice(0,6)!=='VALID:')throw 0;
      sessionStorage.setItem('__c7k',key);
      _st.className='msg ok';
      _st.textContent='Verified';

});
